
{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Noticias CANACO{% endblock %}</title>

    <meta name="description" content="Portal de noticias CANACO">

    <link rel="icon" href="{% static 'nuevo_template/img/favicon.png' %}">

    <!-- Fuentes Blogy -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Poppins:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Estilos Blogy -->
<link rel="stylesheet" href="{% static 'nuevo_template/vendor/bootstrap/css/bootstrap.min.css' %}">
<link rel="stylesheet" href="{% static 'nuevo_template/vendor/bootstrap-icons/bootstrap-icons.css' %}">
<link rel="stylesheet" href="{% static 'nuevo_template/vendor/aos/aos.css' %}">
<link rel="stylesheet" href="{% static 'nuevo_template/vendor/swiper/swiper-bundle.min.css' %}">
<link rel="stylesheet" href="{% static 'nuevo_template/vendor/glightbox/css/glightbox.min.css' %}">
<link rel="stylesheet" href="{% static 'nuevo_template/css/main.css' %}">

    {% block extra_css %}{% endblock %}
</head>

<body class="{% block body_class %}index-page{% endblock %}">

    {% include 'partials/header.html' %}

    {% block content %}{% endblock %}

    {% include 'partials/footer.html' %}

    <!-- JavaScript Blogy -->
    <script src="{% static 'nuevo_template/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'nuevo_template/vendor/aos/aos.js' %}"></script>
    <script src="{% static 'nuevo_template/vendor/swiper/swiper-bundle.min.js' %}"></script>
    <script src="{% static 'nuevo_template/vendor/glightbox/js/glightbox.min.js' %}"></script>
    <script src="{% static 'nuevo_template/js/main.js' %}"></script>

    {% block extra_js %}{% endblock %}

</body>
</html>
