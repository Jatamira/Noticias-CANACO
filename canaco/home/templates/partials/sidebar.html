
{% with current=request.resolver_match.url_name %}

<div class="blog-sidebar">

    <div class="sidebar-item">

        <h3 class="sidebar-title">
            Panel de administración
        </h3>

        <div class="mt-3">

            <nav class="nav flex-column gap-2">

                <a href="{% url 'home:perfil' %}"
                   class="nav-link rounded {% if current == 'perfil' %}active{% endif %}">
                    <i class="bi bi-person-circle me-2"></i>
                    Mi perfil
                </a>

                <a href="{% url 'home:crud_noticias' %}"
                   class="nav-link rounded {% if current == 'crud_noticias' or current == 'crear_publicacion' or current == 'editar_publicacion' %}active{% endif %}">
                    <i class="bi bi-newspaper me-2"></i>
                    Noticias
                </a>

                <a href="{% url 'home:crear_publicacion' %}"
                   class="nav-link rounded {% if current == 'crear_publicacion' %}active{% endif %}">
                    <i class="bi bi-plus-circle me-2"></i>
                    Nueva publicación
                </a>

                <a href="{% url 'home:crud_categorias' %}"
                   class="nav-link rounded {% if current == 'crud_categorias' or current == 'editar_categoria' %}active{% endif %}">
                    <i class="bi bi-tags me-2"></i>
                    Categorías
                </a>

                <a href="{% url 'home:crud_comentarios' %}"
                   class="nav-link rounded {% if current == 'crud_comentarios' %}active{% endif %}">
                    <i class="bi bi-chat-left-text me-2"></i>
                    Comentarios
                </a>

                <a href="{% url 'home:crud_usuarios' %}"
                   class="nav-link rounded {% if current == 'crud_usuarios' or current == 'crear_usuario' or current == 'editar_usuario' %}active{% endif %}">
                    <i class="bi bi-people me-2"></i>
                    Usuarios
                </a>

                <a href="{% url 'home:crud_perfil' %}"
                   class="nav-link rounded {% if current == 'crud_perfil' %}active{% endif %}">
                    <i class="bi bi-person-gear me-2"></i>
                    Editar perfil
                </a>

                <a href="{% url 'home:crud_cambiar_contrasena' %}"
                   class="nav-link rounded {% if current == 'crud_cambiar_contrasena' %}active{% endif %}">
                    <i class="bi bi-shield-lock me-2"></i>
                    Cambiar contraseña
                </a>

                <a href="{% url 'home:index' %}" class="nav-link rounded">
                    <i class="bi bi-house me-2"></i>
                    Volver al inicio
                </a>

            </nav>

        </div>

    </div>

    <style>
        .blog-sidebar .nav-link {
            color: var(--default-color);
            font-weight: 500;
            padding: 11px 14px;
            transition: all 0.3s ease;
        }

        .blog-sidebar .nav-link:hover,
        .blog-sidebar .nav-link.active {
            color: var(--accent-color);
            background: rgba(247, 88, 21, 0.08);
        }

        .blog-sidebar .nav-link i {
            font-size: 17px;
        }
    </style>

</div>

{% endwith %}
